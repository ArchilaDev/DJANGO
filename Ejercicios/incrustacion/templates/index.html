<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>

        {% block title %} {% endblock %}

    </title>
</head>
<style>
    :root {
        --bg-pastel: #e9f0e8;
        --text-coffee: #4a3728;
        --accent-green: #2d5a27;
    }

    body {
        margin: 0;
        background: var(--bg-pastel);
        color: var(--text-coffee);
        font-family: 'Playfair Display', serif;
    }

    /* LOGO BOX */
    .logo-box {
        padding: 20px 5vw;
        font-weight: 800;
        letter-spacing: 2px;
        color: var(--accent-green);
        border-bottom: 1px solid rgba(45, 90, 39, 0.2);
    }

    /* HERO CON DEGRADADO */
    .hero-cabin {
        height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        /* Degradado suave que añade vida sin ensuciar */
        background: linear-gradient(180deg, #e9f0e8 0%, #82AA7D 100%);
        border-bottom: 5px solid var(--accent-green);
    }

    .hero-title {
        font-size: 6rem;
        line-height: 1;
        color: var(--accent-green);
        text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
        margin-bottom: 20px;
    }

    .cta-book {
        background: var(--accent-green);
        color: white;
        padding: 18px 45px;
        border: none;
        cursor: pointer;
        font-size: 1.1rem;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.3s;
    }

    .cta-book:hover {
        transform: scale(1.05);
        background: #3d7a35;
    }

    /* GALERÍA */
    .gallery {
        padding: 80px 5vw;
    }

    .carousel {
        display: flex;
        gap: 20px;
        overflow-x: auto;
        padding-bottom: 20px;
    }

    .img-box {
        min-width: 350px;
        height: 250px;
        background: #c8d5c4;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 3px solid var(--text-coffee);
        border-radius: 8px;
        color: var(--text-coffee);
        font-weight: bold;
    }

    .reviews {
        padding: 80px 5vw;
        text-align: center;
        background: #dce6db;
    }

    .stars {
        color: #b8860b;
        font-size: 2rem;
        margin-bottom: 10px;
    }
</style>

<body>

    <header class="top-bar">
        <div class="logo-box">🌲 ZIRAK9 // FOREST</div>
    </header>

    <section class="hero-cabin">
        <div class="content">
            <h1 class="hero-title">REFUGIO ENTRE PINOS</h1>
            <p>Desconexión total en el corazón del bosque.</p>
            <button class="cta-book">RESERVAR CABAÑA</button>
        </div>
    </section>

    {% include "barra.html" %} <!--Incrusto =! heredo-->

    {% block content %}

    {% endblock %}
    <script src="./script.js"></script>
</body>

</html>
