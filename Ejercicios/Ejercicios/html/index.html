<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos - Gaming Hub</title>
    <!-- Importamos una fuente gamer/moderna de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
        }

        .container {
            background: #111827;
            border: 2px solid #374151;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(99, 102, 241, 0.2);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #6366f1, #ec4899, #8b5cf6);
        }

        h1.game-title {
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            color: #a78bfa;
            margin-bottom: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(167, 139, 250, 0.5);
        }

        strong {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            background: rgba(31, 41, 55, 0.8);
            border-left: 4px solid #6366f1;
        }

        /* Si no hay profesor, cambiamos el borde a rojo de advertencia */
        strong:has-text("No tienes profesor") {
            border-left-color: #ef4444;
            color: #fca5a5;
        }

        ul {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        li {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 16px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        li:hover {
            transform: translateY(-2px);
            border-color: #6366f1;
            background: #252f42;
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        /* Icono decorativo para los cursos estilo gamer */
        li::before {
            content: '🎮';
            font-size: 1.2rem;
            margin-right: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="game-title">⚡ Player Dashboard ⚡</h1>
        <ul>
            {% if Nombre == "Santiago" %}
            <strong>Nombre del profesor: {{Nombre}} ese es bueno</strong>
                {% for elemento in Cursos %}

            <li>
                    {{elemento}}
            </li>

                {% endfor %}
            {% else %}
            <strong>No tienes profesor :C</strong>

            {% endif %}
        </ul>
    </div>
</body>

</html>
